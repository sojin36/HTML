<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컵케이크</title>
</head>
<body style="background-color: rgb(211, 170, 82); color: aliceblue; text-align: center;">
    <h1 style="color: rgb(214, 124, 64);"><i style="font-size: 50px; font-weight: bold;">컵케이크</i></h1>
    <img src="다운로드.jpg" alt="컵케이크" style="width: 200px; border-radius: 30px;">
    <h1 style="text-align: left; padding-left: 190px;">🧁 컵케이크 만드는법 🧁</h1>
    <h3 style="text-align: left; padding-left: 230px;">✅ 준비물 (머핀 4~5개 분량)</h3>
    <ul style="text-align: left; padding-left: 70px;">
            <li>주재료: 박력분 100g, 설탕 40g, 버터 50g (또는 식용유 40ml), 달걀 1개, 우유 30ml</li>
            <li>부재료: 베이킹파우더 4g, 소금 한 꼬집, 바닐라 엑스트라킷(선택, 비린내 제거용)</li>
    </ul>
    <h3 style="text-align: left; padding-left: 270px;">👩‍🍳 만드는 순서</h3>
    <ol type="1" style="text-align: left; padding-left: 70px;">
        <li>재료 상온 준비하기</li>
        <li>반죽 만들기 (볼에 섞기) </li>
        <li>가루류 섞기</li>
        <li>틀에 붓고 굽기</li>
    </ol>
    <img src="다운로드 (1).jpg" style="">

</body>
</html>
