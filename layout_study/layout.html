    <title>연습</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .cate{
            width: 80%;
            margin: 50px auto;
            background-color: #fff;
            padding: 30px 20px;
            display: flex;
            gap: 50PX;
            justify-content: center;
        }
        /* 아이템 */
        .cate-item{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100px;
            /* background-color: palegreen; */
            cursor: pointer;
        }
        .cate-item img{
            width: 100%;
            display: block;
        }
        .cate-img{
            border-radius: 45px;
            overflow: hidden;
        }
        /* 상단 오른쪽 */
        .header-right{
            display: flex;
            justify-content: flex-end;
            width: 90%;
            background-color: #fff;
            margin: auto;
            gap: 40px;
            padding: 30px 0;
        }
        /* 아이템 */
        .header-item{
            display: flex;
            gap: 4px;
            cursor: pointer;
        }
        .header-item span{
            font-size: 12px;
        }
    </style>
</head>
